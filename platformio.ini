; Fronius-Display – Elecrow CrowPanel, beide ESP32-S3-WROOM-1-N4R8, 800 x 480
;
;   crowpanel5  – 5,0" DIS07050H, Board V3.0
;   crowpanel7  – 7,0" DIS08070H, Board V3.0
;
; Welche Groesse du hast, steht auf der Rueckseite der Platine (SKU).
; In VS Code unten in der Statusleiste die passende Umgebung waehlen –
; die Firmware des einen Displays laeuft NICHT auf dem anderen.
;
; Grundlage: Arduino-ESP32 3.x (ESP-IDF 5) ueber pioarduino –
; derselbe Unterbau wie violet-display (github.com/AlPi-BRV/violet-display).
; Der erste Build dauert laenger, weil die Arduino-Bibliotheken mit den
; Einstellungen unter custom_sdkconfig neu gebaut werden.
; Wichtig unter Windows: Projektpfad OHNE Leerzeichen (z. B. C:\pio\fronius-display).

[platformio]
; Nur EINE Umgebung als Standard, damit "Upload" nie beide nacheinander aufspielt.
; Fuer das 7": in VS Code unten "env:crowpanel7" waehlen (oder pio run -e crowpanel7 -t upload).
default_envs = crowpanel5

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 4MB
; zwei Programmbereiche (je 1,9 MB) fuer Updates ueber WLAN;
; die Einstellungen (NVS) liegen an derselben Stelle wie vorher und bleiben erhalten
board_build.partitions = partitions.csv

; Gegen das Zucken des Displays (siehe Espressif-Doku "RGB Interfaced LCD"):
;  - Programm aus dem PSRAM ausfuehren, damit Flash-Schreibzugriffe (Update,
;    Einstellungen speichern) das Display nicht anhalten
;  - Display-Interrupt im internen RAM, damit der Bounce-Buffer immer nachgefuellt wird
custom_sdkconfig =
    CONFIG_SPIRAM_XIP_FROM_PSRAM=y
    CONFIG_LCD_RGB_ISR_IRAM_SAFE=y
    CONFIG_LCD_RGB_RESTART_IN_VSYNC=y

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    https://github.com/lovyan03/LovyanGFX.git#1.2.31
    bblanchon/ArduinoJson@^7.0.4

; ---------------------------------------------------------------
[env:crowpanel5]
; 5,0" DIS07050H

[env:crowpanel7]
; 7,0" DIS08070H
build_flags =
    ${env.build_flags}
    -DBOARD_CROWPANEL7
    ; Falls der Touch um 180° gedreht reagiert, naechste Zeile aktivieren:
    ; -DTOUCH_ROTATE_180
